<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1d">
  <meta name="robots" content="noindex, nofollow">
  <title>AION 2 DPS Meter</title>
  <link rel="preload" href="/fonts/cinzel-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Navigation">
      <a class="brand" href="#/start"><span class="brand-main">AION 2</span><span class="brand-sub">DPS Meter</span></a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="status" id="status"><span class="dot"></span><span>Verbinde …</span></div>
        <div class="who" id="whoami"></div>
        <div class="room-chip" id="roomChip"></div>
        <button class="btn ghost" id="logout" type="button">Abmelden</button>
      </div>
    </aside>

    <header class="mtop">
      <a class="brand" href="#/start"><span class="brand-main">AION 2</span><span class="brand-sub">DPS Meter</span></a>
      <span class="status" id="statusM"><span class="dot"></span></span>
    </header>

    <main id="view" tabindex="-1">
      <noscript><p class="empty">Das Dashboard braucht JavaScript.</p></noscript>
    </main>

    <nav class="bottomnav" id="bottomnav" aria-label="Navigation"></nav>
    <div class="sheet" id="sheet" hidden></div>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
