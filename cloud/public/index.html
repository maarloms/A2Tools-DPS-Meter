<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1222">
  <meta name="robots" content="noindex, nofollow">
  <title>Gruppen-Meter</title>
  <link rel="preload" href="fonts/cinzel-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1222'/%3E%3Cpath d='M8 24 L16 6 L24 24 M11 18 H21' stroke='%23d4af69' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <span class="brand">Atreia <small>Gruppen-Meter</small></span>
    <span class="room-chip" id="roomChip"></span>
    <span class="status" id="status"><span class="dot"></span><span>Getrennt</span></span>
    <nav class="nav">
      <a href="#/live" data-nav="live">Live</a>
      <a href="#/fights" data-nav="fights">Kämpfe</a>
      <a href="#/ranks/boss" data-nav="ranks">Bestenliste</a>
      <a href="#/trends" data-nav="trends">Trends</a>
      <a href="#/timer" data-nav="timer">Timer</a>
      <button class="btn" id="logout" type="button" title="Raum verlassen">Abmelden</button>
    </nav>
  </header>

  <main id="view">
    <noscript><p class="empty">Das Dashboard braucht JavaScript.</p></noscript>
  </main>

  <template id="tplLogin">
    <section class="card login">
      <h1>Gruppen-Meter</h1>
      <p class="meta">AION 2 · Live-Schaden der Gruppe und Kampf-Historie</p>
      <form id="loginForm" autocomplete="off">
        <label class="field"><span>Raum-Code</span>
          <input type="text" name="room" required pattern="[a-z0-9][a-z0-9\-]{2,31}" autocapitalize="none" spellcheck="false" placeholder="z. B. atreia-trio"></label>
        <label class="field"><span>Raum-Secret</span>
          <input type="password" name="secret" required minlength="16" autocomplete="current-password"></label>
        <label class="check"><input type="checkbox" name="remember" checked> Auf diesem Gerät merken</label>
        <p class="err-text" id="loginErr" role="alert"></p>
        <button class="btn primary" type="submit">Verbinden</button>
      </form>
    </section>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
